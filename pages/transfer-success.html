    <style id="theme-vars">
/* Project: payment-receipt-flow
   Single brand hue: payment blue. Neutral surfaces carry most of the page. */

:root {
  /* Brand primary scale (single hue) */
  --pay-primary-50: #eef4ff;
  --pay-primary-100: #dbe7ff;
  --pay-primary-200: #b9d1ff;
  --pay-primary-300: #8fb4ff;
  --pay-primary-400: #5f8ffb;
  --pay-primary-500: #2f6bff;
  --pay-primary-600: #1e57e6;
  --pay-primary-700: #1845b8;
  --pay-primary-800: #14398f;
  --pay-primary-900: #102c6b;

  /* Neutral scale */
  --pay-neutral-0: #ffffff;
  --pay-neutral-25: #fbfcfe;
  --pay-neutral-50: #f6f7fb;
  --pay-neutral-100: #f2f3f7;
  --pay-neutral-200: #e8eaf0;
  --pay-neutral-300: #d9dce4;
  --pay-neutral-400: #b3b8c4;
  --pay-neutral-500: #8a8f9b;
  --pay-neutral-600: #6b7280;
  --pay-neutral-700: #4b5563;
  --pay-neutral-800: #2c313a;
  --pay-neutral-900: #16181d;

  /* Semantic aliases (required by head contract) */
  --pay-background: #f6f7fb;
  --pay-foreground: #16181d;
  --pay-card: #ffffff;
  --pay-card-foreground: #16181d;
  --pay-popover: #ffffff;
  --pay-popover-foreground: #16181d;
  --pay-primary: #2f6bff;
  --pay-primary-foreground: #ffffff;
  --pay-muted: #f2f3f7;
  --pay-muted-foreground: #8a8f9b;
  --pay-border: #edeff3;
  --pay-input: #edeff3;
  --pay-ring: #2f6bff;

  /* Radius scale */
  --pay-radius-small: 4px;
  --pay-radius-medium: 8px;
  --pay-radius-large: 12px;
  --pay-radius-pill: 999px;

  /* Static surface depth: border/surface led, shadow alpha <= 0.05 */
  --pay-shadow-card: 0 1px 2px rgba(15, 23, 42, 0.04);
  --pay-shadow-float: 0 8px 24px -8px rgba(15, 23, 42, 0.18);

  /* Page 1 action gradient (reference-derived blue to violet) */
  --pay-cta-gradient: linear-gradient(96deg, #4a6cf7 0%, #6a55ee 52%, #8a4be8 100%);

  /* Page 2 result screen blue gradient (single-hue blue) */
  --pay-result-top: #0f63ef;
  --pay-result-mid: #4c97f6;
  --pay-result-soft: #cfe5ff;
  --pay-result-bottom: #eef6ff;
  --pay-result-glow: radial-gradient(120% 60% at 50% 0%, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0) 60%);

  /* Price / discount emphasis, used only on bill detail */
  --pay-discount: #e05567;
  --pay-link: #2f6bff;

  /* Page 1 reference details */
  --pay-icon-tile-bg: #fbf3dc;
  --pay-icon-gold: #c29b2e;
  --pay-chip-bg: #f2f3f7;
  --pay-chip-text: #5a5f68;

  /* Page 2 result screen details */
  --pay-result-gradient: linear-gradient(180deg, #0f63ef 0%, #2c7bf4 34%, #7fb6fa 58%, #d8ebff 78%, #f6faff 100%);
  --pay-result-border: #bbd7ff;
  --pay-result-button-bg: #ffffff;
  --pay-result-button-text: #2f6bff;
  --pay-on-primary-soft: rgba(255, 255, 255, 0.9);
  --pay-on-primary-muted: rgba(255, 255, 255, 0.72);
  --pay-result-line: rgba(255, 255, 255, 0.2);

  /* Page 3 bill detail details */
  --pay-bill-bg: #f2f4f8;
  --pay-surface-alt: #fbfcfe;
  --pay-chip-blue-bg: #e8f4ff;
  --pay-chip-blue-text: #2f6bff;
  --pay-recommend-bg: #f6f7fa;
  --pay-white: #ffffff;

  /* Type system */
  --pay-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --pay-font-mono: "SF Mono", "JetBrains Mono", ui-monospace, monospace;

  --pay-text-display: 56px;
  --pay-text-h1: 26px;
  --pay-text-h2: 22px;
  --pay-text-h3: 17px;
  --pay-text-body: 15px;
  --pay-text-caption: 13px;
}

html {
  background: var(--pay-background);
  color: var(--pay-foreground);
  font-family: var(--pay-font-sans);
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  font-family: var(--pay-font-sans);
  font-size: var(--pay-text-body);
  line-height: 1.5;
  color: var(--pay-foreground);
  background: var(--pay-background);
  -webkit-font-smoothing: antialiased;
}

h1,
h2,
h3,
p,
figure {
  margin: 0;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

.pay-num {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

    </style>

    <style type="text/tailwindcss">

    --color-popover: var(--pay-popover);

  }
    </style>

<body class="min-h-screen font-sans antialiased">
    <main>
      <style id="critical-layout">
        .pay-result-screen {
          position: relative;
          display: flex;
          flex-direction: column;
          width: 100%;
          max-width: 480px;
          min-height: 100vh;
          margin: 0 auto;
          padding: 16px 24px calc(28px + env(safe-area-inset-bottom));
          box-sizing: border-box;
          overflow-x: hidden;
          background: var(--pay-result-gradient);
          color: var(--pay-white);
          font-family: var(--pay-font-sans);
        }
        .pay-result-screen::before {
          content: "";
          position: absolute;
          top: 0;
          right: 0;
          left: 0;
          height: 46%;
          background: var(--pay-result-glow);
          pointer-events: none;
        }
        .pay-result-head {
          position: relative;
          z-index: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          min-height: 28px;
        }
        .pay-result-head-icon {
          display: inline-flex;
          flex: 0 0 auto;
          width: 20px;
          height: 20px;
          color: var(--pay-white);
        }
        .pay-result-head-icon svg {
          display: block;
          width: 20px;
          height: 20px;
        }
        .pay-result-title {
          font-size: 17px;
          font-weight: 500;
          line-height: 1.2;
          color: var(--pay-white);
          letter-spacing: 0;
          white-space: nowrap;
        }
        .pay-complete-top {
          position: absolute;
          top: 0;
          right: 0;
          z-index: 2;
          padding: 4px 0;
          border: 0;
          background: transparent;
          color: var(--pay-white);
          font-size: 17px;
          font-weight: 500;
          line-height: 1.2;
          border-radius: var(--pay-radius-small);
          transition: opacity 140ms cubic-bezier(.2,.8,.2,1);
        }
        .pay-complete-top:hover {
          opacity: 0.82;
        }
        .pay-complete-top:focus-visible {
          outline: 2px solid var(--pay-white);
          outline-offset: 2px;
        }
        .pay-amount {
          position: relative;
          z-index: 1;
          display: flex;
          align-items: baseline;
          justify-content: center;
          gap: 2px;
          margin-top: 28px;
          color: var(--pay-white);
          white-space: nowrap;
        }
        .pay-amount-currency {
          font-size: 32px;
          font-weight: 600;
          line-height: 1;
        }
        .pay-amount-number {
          font-size: 58px;
          font-weight: 600;
          line-height: 1;
          letter-spacing: -0.02em;
          font-variant-numeric: tabular-nums;
          font-feature-settings: "tnum" 1;
        }
        .pay-result-summary {
          position: relative;
          z-index: 1;
          display: flex;
          flex-direction: column;
          gap: 16px;
          margin-top: 36px;
        }
        .pay-result-row {
          display: flex;
          align-items: flex-start;
          justify-content: space-between;
          gap: 24px;
        }
        .pay-result-label {
          flex: 0 0 auto;
          font-size: 15px;
          font-weight: 400;
          line-height: 1.45;
          color: var(--pay-on-primary-soft);
        }
        .pay-result-value {
          min-width: 0;
          font-size: 17px;
          font-weight: 600;
          line-height: 1.4;
          color: var(--pay-white);
          text-align: right;
          overflow-wrap: break-word;
        }
        .pay-result-payee {
          display: flex;
          align-items: center;
          justify-content: flex-end;
          gap: 8px;
        }
        .pay-result-spacer {
          flex: 1 1 auto;
          min-height: 180px;
        }
        .pay-complete-bottom {
          position: relative;
          z-index: 1;
          flex: 0 0 auto;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 100%;
          height: 52px;
          margin-top: auto;
          border: 1px solid var(--pay-result-border);
          border-radius: var(--pay-radius-pill);
          background: var(--pay-result-button-bg);
          color: var(--pay-result-button-text);
          font-size: 17px;
          font-weight: 600;
          line-height: 1;
          transition: filter 140ms cubic-bezier(.2,.8,.2,1), transform 140ms cubic-bezier(.2,.8,.2,1);
        }
        .pay-complete-bottom:hover {
          filter: brightness(0.97);
          transform: translateY(-1px);
        }
        .pay-complete-bottom:active {
          filter: none;
          transform: translateY(0);
        }
        .pay-complete-bottom:focus-visible {
          outline: 2px solid var(--pay-primary);
          outline-offset: 2px;
        }
        @media (hover: none) {
          .pay-complete-top:hover {
            opacity: 1;
          }
          .pay-complete-bottom:hover {
            filter: none;
            transform: none;
          }
        }
        @media (prefers-reduced-motion: reduce) {
          .pay-complete-top,
          .pay-complete-bottom {
            transition-duration: 0.01ms;
          }
        }
      </style>
      <div class="pay-result-screen">
        <header class="pay-result-head">
          <span class="pay-result-head-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
              <path d="M21.801 10A10 10 0 1 1 17 3.335"></path>
              <path d="m9 11 3 3L22 4"></path>
            </svg>
          </span>
          <h1 class="pay-result-title">转账成功</h1>
          <button type="button" class="pay-complete-top" data-dom-id="complete-top">完成</button>
        </header>

        <p class="pay-amount">
          <span class="pay-amount-currency">¥</span>
          <span class="pay-amount-number" id="resultAmount">5000.00</span>
        </p>

        <div class="pay-result-summary">
          <div class="pay-result-row">
            <span class="pay-result-label">收款方</span>
            <span class="pay-result-value pay-result-payee">
              
              <span id="resultPayee">5锅(陈*如)</span>
            </span>
          </div>
          <div class="pay-result-row">
            <span class="pay-result-label">付款方式</span>
            <span class="pay-result-value" id="resultMethod">支付宝</span>
          </div>
        </div>

        <div class="pay-result-spacer" aria-hidden="true"></div>

        <button type="button" class="pay-complete-bottom" data-dom-id="complete-bottom">完成</button>
      </div>

      <script>
        (function () {
          var fallback = {
            name: '陈*如',
            nickname: '5锅',
            account: '3836227326@qq.com',
            amount: '5000.00',
            method: '支付宝'
          };
          var data = fallback;
          try {
            var saved = JSON.parse(localStorage.getItem('payReceiptData') || 'null');
            if (saved && typeof saved === 'object') {
              data = {
                name: saved.name || fallback.name,
                nickname: saved.nickname || fallback.nickname,
                account: saved.account || fallback.account,
                amount: saved.amount || fallback.amount,
                method: saved.method || fallback.method
              };
            }
          } catch (err) {
            data = fallback;
          }

          var amount = Number(String(data.amount).replace(/,/g, '')) || 0;
          document.getElementById('resultAmount').textContent = amount.toFixed(2);
          document.getElementById('resultPayee').textContent =
            data.nickname && data.name ? data.nickname + '(' + data.name + ')' : (data.nickname || data.name);
          document.getElementById('resultMethod').textContent = data.method;

          document.querySelectorAll('[data-dom-id="complete-top"], [data-dom-id="complete-bottom"]').forEach(function (btn) {
            btn.addEventListener('click', function () {
              window.location.href = 'bill-detail.html';
            });
          });
        })();
      </script>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
